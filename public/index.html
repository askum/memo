<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데스크톱 메모 - Desktop Memo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Left Pane: Folder Tree -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="app-brand">
          <span class="brand-icon">📝</span>
          <span class="brand-title">Desktop Memo</span>
        </div>
      </div>

      <!-- Current Root Folder Card -->
      <div class="folder-select-box">
        <div class="folder-meta">
          <span class="folder-label">현재 작업 폴더</span>
          <span class="folder-name" id="currentFolderName" title="클릭하여 폴더 변경">📁 memos</span>
        </div>
        <button class="btn btn-secondary btn-sm" id="btnChangeFolder" title="다른 폴더 선택">폴더 변경</button>
      </div>

      <!-- Toolbar: New File, New Folder, Refresh -->
      <div class="tree-toolbar">
        <button class="btn btn-primary btn-sm" id="btnNewFile" title="새 메모 생성">
          <span class="icon">+</span> 새 메모
        </button>
        <button class="btn btn-secondary btn-sm" id="btnNewFolder" title="새 폴더 생성">
          <span class="icon">+</span> 새 폴더
        </button>
        <button class="btn btn-icon btn-sm" id="btnRefresh" title="새로고침">
          🔄
        </button>
      </div>

      <!-- Filter / Search Box -->
      <div class="search-box">
        <input type="text" id="treeSearchInput" placeholder="🔍 파일/폴더 검색..." autocomplete="off">
      </div>

      <!-- Tree Container -->
      <div class="tree-scroll-container">
        <div class="tree-root" id="treeRoot">
          <!-- Tree items dynamically injected by JS -->
        </div>
      </div>
    </aside>

    <!-- Resizable Splitter -->
    <div class="splitter" id="splitter"></div>

    <!-- Right Pane: Memo Editor -->
    <main class="editor-pane">
      <!-- Top Action Header -->
      <header class="editor-header" id="editorHeader">
        <div class="file-info-group">
          <!-- Back and Forward History Navigation Buttons -->
          <div class="nav-history-buttons">
            <button class="btn btn-icon btn-sm" id="btnNavBack" disabled title="이전 메모로 뒤로가기 (단축키: Cmd+[ 또는 Alt+←)">
              ◀
            </button>
            <button class="btn btn-icon btn-sm" id="btnNavForward" disabled title="다음 메모로 앞으로가기 (단축키: Cmd+] 또는 Alt+→)">
              ▶
            </button>
          </div>
          <span class="file-type-icon" id="fileIcon">📝</span>
          <div class="file-titles">
            <h1 class="file-title" id="fileTitle">선택된 메모 없음</h1>
            <span class="file-path" id="filePathDisplay">👈 왼쪽 트리에서 메모 파일을 선택하거나 새로 만드세요</span>
          </div>
        </div>

        <div class="editor-actions">
          <button class="btn btn-secondary btn-sm" id="btnInsertLink" disabled title="다른 메모로 이동하는 링크 삽입 (단축키: Cmd+K / Ctrl+K)">
            🔗 링크 삽입
          </button>
          <span class="status-badge" id="saveStatusBadge"></span>
          <button class="btn btn-primary" id="btnManualSave" disabled title="단축키: Cmd+S / Ctrl+S">
            💾 저장
          </button>
        </div>
      </header>

      <!-- Text Editor Container -->
      <div class="editor-body" id="editorBody">
        <div class="empty-state" id="emptyState">
          <div class="empty-content">
            <span class="empty-icon">📂</span>
            <h2>메모가 선택되지 않았습니다</h2>
            <p>왼쪽 트리에서 메모를 클릭하여 열거나, <strong>[+ 새 메모]</strong> 버튼을 눌러 새 메모를 시작하세요.</p>
          </div>
        </div>

        <textarea 
          id="memoTextarea" 
          class="memo-textarea hidden" 
          placeholder="여기에 자유롭게 메모를 작성하세요... (입력시 자동으로 실시간 저장됩니다)&#10;다른 메모로 연결하려면 우측 상단 [🔗 링크 삽입]을 누르거나 '[[메모이름]]'을 적어두고 더블 클릭하면 됩니다."
          spellcheck="false"
        ></textarea>
      </div>

      <!-- Bottom Status Bar -->
      <footer class="editor-footer">
        <div class="footer-left">
          <span id="charCount">0 글자</span>
          <span class="separator">|</span>
          <span id="wordCount">0 단어</span>
        </div>
        <div class="footer-right">
          <span id="cursorPos">줄 1, 열 1</span>
          <span class="separator">|</span>
          <span>UTF-8</span>
          <span class="separator">|</span>
          <span id="lastSavedTime">대기 중</span>
        </div>
      </footer>
    </main>
  </div>

  <!-- Custom Modal Dialog (for Folder Path / New File / Rename) -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal-card">
      <h3 class="modal-title" id="modalTitle">입력</h3>
      <p class="modal-desc" id="modalDesc"></p>
      <input type="text" class="modal-input" id="modalInput" autocomplete="off">
      <div class="modal-buttons">
        <button class="btn btn-secondary" id="btnModalCancel">취소</button>
        <button class="btn btn-primary" id="btnModalConfirm">확인</button>
      </div>
    </div>
  </div>

  <!-- Link Selector Modal -->
  <div class="modal-overlay hidden" id="linkModalOverlay">
    <div class="modal-card link-modal-card">
      <h3 class="modal-title">🔗 연결할 메모 선택</h3>
      <p class="modal-desc">본문에 바로가기 링크를 삽입할 메모를 선택하세요:</p>
      <input type="text" class="modal-input" id="linkSearchInput" placeholder="검색할 메모 제목..." autocomplete="off">
      <div class="link-items-list" id="linkItemsList"></div>
      <div class="modal-buttons">
        <button class="btn btn-secondary" id="btnLinkModalCancel">취소</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=4"></script>
</body>
</html>
