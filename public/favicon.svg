<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Crisp drop shadow -->
    <filter id="crispShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <!-- Vibrant top header gradient -->
    <linearGradient id="memoHeaderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <!-- Paper gradient -->
    <linearGradient id="memoPaperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <!-- Pencil barrel gradient -->
    <linearGradient id="pencilWoodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Main Memo Pad with Drop Shadow -->
  <g filter="url(#crispShadow)">
    <!-- Base Paper Sheet -->
    <rect x="14" y="12" width="100" height="104" rx="18" fill="url(#memoPaperGrad)" stroke="#CBD5E1" stroke-width="2" />

    <!-- Top Golden Binder Header -->
    <path d="M 14 32 L 14 30 A 18 18 0 0 1 32 12 L 96 12 A 18 18 0 0 1 114 30 L 114 36 L 14 36 Z" fill="url(#memoHeaderGrad)" />
    <!-- Header bottom seam -->
    <line x1="14" y1="36" x2="114" y2="36" stroke="#B45309" stroke-width="2" />

    <!-- Spiral Binder Rings (Bold & Crisp) -->
    <g fill="#78350F">
      <rect x="25" y="6" width="6" height="14" rx="3" fill="#92400E" stroke="#FEF3C7" stroke-width="1.5" />
      <rect x="45" y="6" width="6" height="14" rx="3" fill="#92400E" stroke="#FEF3C7" stroke-width="1.5" />
      <rect x="65" y="6" width="6" height="14" rx="3" fill="#92400E" stroke="#FEF3C7" stroke-width="1.5" />
      <rect x="85" y="6" width="6" height="14" rx="3" fill="#92400E" stroke="#FEF3C7" stroke-width="1.5" />
    </g>

    <!-- Red Margin Line -->
    <line x1="32" y1="37" x2="32" y2="114" stroke="#F87171" stroke-width="2" opacity="0.85" />

    <!-- Clear Ruled Note Lines -->
    <line x1="38" y1="52" x2="104" y2="52" stroke="#E2E8F0" stroke-width="2" />
    <line x1="38" y1="68" x2="104" y2="68" stroke="#E2E8F0" stroke-width="2" />
    <line x1="38" y1="84" x2="104" y2="84" stroke="#E2E8F0" stroke-width="2" />
    <line x1="38" y1="100" x2="104" y2="100" stroke="#E2E8F0" stroke-width="2" />

    <!-- Bold Title & Content Bars (Simulated clear text) -->
    <rect x="40" y="44" width="42" height="5" rx="2.5" fill="#2563EB" />
    <rect x="40" y="60" width="56" height="4" rx="2" fill="#64748B" />
    <rect x="40" y="76" width="46" height="4" rx="2" fill="#64748B" />
    <rect x="40" y="92" width="34" height="4" rx="2" fill="#64748B" />
  </g>

  <!-- Bold Angled Pencil in Foreground -->
  <g transform="translate(78, 70) rotate(-42)">
    <!-- Shadow behind pencil -->
    <rect x="-7" y="-22" width="14" height="48" rx="2" fill="#000000" opacity="0.2" filter="blur(2px)" />

    <!-- Eraser (Pink) -->
    <rect x="-6" y="-24" width="12" height="9" rx="3" fill="#F43F5E" />
    <!-- Metal Ferrule (Silver) -->
    <rect x="-6" y="-15" width="12" height="7" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />

    <!-- Pencil Hexagonal Body -->
    <rect x="-6" y="-8" width="12" height="34" fill="url(#pencilWoodGrad)" stroke="#B45309" stroke-width="1" />
    <!-- Center facet highlight -->
    <line x1="0" y1="-8" x2="0" y2="26" stroke="#FEF08A" stroke-width="2" />

    <!-- Sharpened Wood Cone -->
    <polygon points="-6,26 6,26 0,38" fill="#FDE68A" stroke="#D97706" stroke-width="0.8" />
    <!-- Dark Graphite Lead Tip -->
    <polygon points="-2.5,33 2.5,33 0,38" fill="#0F172A" />
  </g>
</svg>
